name: journey_notification
description: Android system notification bridge for the passenger journey demo.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.vexenhanh.journey_notification
        pluginClass: JourneyNotificationPlugin
