name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generate API client
        run: pnpm gen:api-client

      # Trước đây bước trên chỉ sinh lại rồi vứt: đổi DTO backend mà quên commit
      # `openapi.json` / `schema.ts` thì CI vẫn xanh, và mọi client (Web lẫn Dart)
      # chạy theo hợp đồng cũ. Bắt lệch ngay tại đây.
      - name: Hợp đồng API phải khớp bản đã commit
        run: |
          if ! git diff --exit-code -- packages/api-client/src/generated; then
            echo "::error::openapi.json/schema.ts lech code. Chay 'pnpm gen:api-client' roi commit."
            exit 1
          fi
