services:
  - type: web
    name: vexenhanh-api
    runtime: docker
    region: singapore
    # v1 validate: free tier ($0). Ngủ sau ~15p inactivity → cold-start ~30-60s.
    # Lên `starter` ($7, always-on) khi go-live ở TASK-OPS-001.
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /v1/health
    envVars:
      - fromGroup: vexenhanh-foundation
      - key: SENTRY_DSN
        sync: false
      - key: PORT
        value: "3000"

# ADR-024: worker = Render Background Worker (cùng image, command `dist/worker.js`);
# payout/reconciliation = BullMQ repeatable jobs TRONG worker (KHÔNG Render Cron Job riêng).
# Render Background Worker KHÔNG có free tier → DEFER tới TASK-OPS-001 (paid).
# v1 validate: worker chạy LOCAL (`pnpm --filter @vexenhanh/api start:worker`).
# Bật lại khi go-paid (uncomment + nạp thẻ):
#  - type: worker
#    name: vexenhanh-worker
#    runtime: docker
#    region: singapore
#    plan: starter
#    dockerfilePath: ./Dockerfile
#    dockerContext: .
#    dockerCommand: dist/worker.js
#    autoDeployTrigger: checksPass
#    maxShutdownDelaySeconds: 120
#    envVars:
#      - fromGroup: vexenhanh-foundation
#      - key: SENTRY_DSN
#        sync: false

envVarGroups:
  - name: vexenhanh-foundation
    envVars:
      - key: NODE_ENV
        value: production
      - key: SENTRY_ENVIRONMENT
        value: production
